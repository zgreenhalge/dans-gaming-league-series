# icon-sync (issue #103 follow-up)
#
# Re-pulls this repo's CS2 icon SVGs (public/{round,grenade,side,kill,weapon}-icons/) from
# github.com/Juknum/counter-strike-icons, which itself re-extracts Panorama UI assets from Valve's
# CS2 depot on every game update. Only the curated set of files in scripts/sync-icons.ts's
# MANIFEST is ever touched.
#
# Runs weekly (these assets change far less often than the upstream repo's own daily
# build-detection cadence) and can be dispatched manually any time. Manual runs default to a dry
# run (report only, no PR) as a safety net; the scheduled run always applies for real — same
# convention as dathost-cleanup.yml.
#
# On a real run: any changed icon gets committed to a single reused branch and opened (or
# updated, if already open) as a PR for review — never auto-merged. Any manifest entry that
# couldn't be fetched or no longer parses is left untouched and both recorded to `ops_errors`
# (surfaces on /admin) and called out in the PR body for manual follow-up.

name: icon-sync

on:
  schedule:
    - cron: '41 8 * * 1' # weekly, Monday, off the hour to avoid GitHub's cron pile-up
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report what would change without writing files or opening a PR
        type: boolean
        default: true

concurrency:
  group: icon-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync icons from upstream
        run: npx tsx scripts/sync-icons.ts
