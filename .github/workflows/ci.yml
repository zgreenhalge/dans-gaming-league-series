# CI — lint/test/build/E2E gate (issue #116).
#
# Runs on every PR and push to main. Independent jobs, gated by changed paths so an
# ingestion-only PR doesn't spin up Node and vice versa. Frontend build needs real Supabase
# creds because `next build` prerenders static pages that read from Supabase at build time.
# `e2e` runs against its own local Supabase stack (Docker), never production — see docs/e2e.md.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      ingestion: ${{ steps.filter.outputs.ingestion }}
      ehog: ${{ steps.filter.outputs.ehog }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine changed areas
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            frontend:
              - '**'
              - '!ingestion/**'
              - '!docs/**'
              - '!*.md'
              - '!LICENSE'
            ingestion:
              - 'ingestion/**'
            ehog:
              - 'ehog/**'
              - 'src/lib/ehog.ts'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # NextAuth reads its signing secret from `NEXTAUTH_SECRET` when `authOptions.js` doesn't pass
      # one explicitly. Left unset, it falls back to a random per-instantiation secret — `next dev`
      # re-instantiates the auth route's module on recompiles, so a session cookie encrypted before
      # a recompile fails to decrypt after ("JWEDecryptionFailed"), breaking any test that logs in
      # via the dev-mock providers and then navigates. Fixed values, same pattern as the demo JWTs
      # above; NEXTAUTH_URL matches playwright.config.ts's baseURL (PLAYWRIGHT_PORT, default 3100).
      NEXTAUTH_SECRET: e2e-test-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://localhost:3100
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # supabase/local.env carries the fixed anon/service_role JWTs shared with docs/e2e.md's manual
      # setup and .claude/hooks/session-start.sh's automatic bootstrap — one place to update if
      # supabase/config.toml's pinned jwt_secret ever changes. NEXT_PUBLIC_SUPABASE_URL is excluded
      # here since it's derived dynamically below instead (see that step for why).
      - name: Export local Supabase demo JWTs
        run: grep -v '^NEXT_PUBLIC_SUPABASE_URL=' supabase/local.env >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Start local Supabase (applies supabase/migrations + supabase/seed.sql)
        run: supabase start

      - name: Export local Supabase connection env vars
        # `-o env` quotes every value (`API_URL="http://..."`). `$GITHUB_ENV` isn't shell-parsed —
        # it takes everything after the first `=` as the literal value, so those quotes would
        # otherwise end up embedded in the env var itself and fail URL validation downstream.
        run: supabase status -o env | sed -E 's/^([A-Za-z_][A-Za-z0-9_]*)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"

      # `$GITHUB_ENV` writes only become real env vars starting the *next* step, not later in the
      # same script that wrote them — this has to be its own step, not folded into the one above,
      # or $API_URL reads back empty even though the write succeeded (regression from #418: it was
      # briefly a single step and silently broke this exact way — see #420 CI run 32058589313).
      - name: Map to the app's expected env var name
        run: echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Verify the env vars the app needs are actually set
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL is empty — supabase status -o env didn't set API_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is empty"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is empty"; exit 1; }

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  ingestion:
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ingestion
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install supabase python-dotenv

      - name: Test
        run: python3 -m unittest tests.test_ingest

  ehog:
    needs: changes
    if: needs.changes.outputs.ehog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r api/ehog/requirements.txt

      - name: Parity test
        run: python ehog/test_parity.py && npx tsx ehog/test_parity.ts
