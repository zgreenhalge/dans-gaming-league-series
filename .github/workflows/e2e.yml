# Playwright end-to-end coverage (issue #413) — a separate, slower workflow from `ci.yml`'s
# `frontend` job. Runs entirely against a local Supabase stack (Postgres + PostgREST + Realtime,
# no GoTrue — see supabase/config.toml), built from supabase/migrations/*.sql + supabase/seed.sql,
# never against the production project. Not run on every PR — trigger manually, or by adding the
# `run-e2e` label to a PR. See docs/e2e.md.

name: E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Start local Supabase (applies supabase/migrations + supabase/seed.sql)
        run: supabase start

      - name: Export local Supabase connection env vars
        run: |
          supabase status -o env >> "$GITHUB_ENV"

      - name: Map to the app's expected env var names
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
