# Playwright end-to-end coverage (issue #413) — a separate, slower workflow from `ci.yml`'s
# `frontend` job. Runs entirely against a local Supabase stack (Postgres + PostgREST + Realtime,
# no GoTrue — see supabase/config.toml), built from supabase/migrations/*.sql + supabase/seed.sql,
# never against the production project. Not run on every PR — trigger manually, or by adding the
# `run-e2e` label to a PR. See docs/e2e.md.

name: E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Fixed local-dev-only demo JWTs derived from supabase/config.toml's pinned `auth.jwt_secret`
      # (role: anon / service_role, iss: supabase-demo) — not real secrets, just deterministic
      # values for a throwaway local Postgres. Hardcoded rather than parsed from `supabase status`:
      # recent Supabase CLI releases stopped reliably printing these from `status`/`start` output
      # (a known upstream regression, supabase/cli#4211), and since they're fully determined by the
      # pinned jwt_secret, there's nothing to "look up" at runtime anyway.
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjIxNDU5MTY4MDB9.SD8OGMUA7SztCSQyoNK_up2hNla9czXlhL7RvNeh1kw
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MjE0NTkxNjgwMH0.Q_XOunt2yFrXAkYRNeh5JgAO_M_zLBEh7OwNnfEJjXU
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Start local Supabase (applies supabase/migrations + supabase/seed.sql)
        run: supabase start

      - name: Export the local API URL
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"

      - name: Verify the env vars the app needs are actually set
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL is empty — supabase status -o env didn't set API_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is empty"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is empty"; exit 1; }

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
