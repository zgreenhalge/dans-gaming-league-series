# discord-inspect-thread
#
# Manual, read-only dump of a Discord thread's message history and the guild's scheduled events —
# see scripts/inspect-discord-thread.ts. Run this via workflow_dispatch (Actions tab, or the API) when
# discord-event-sync's no_thread/no_event result for a match doesn't match what's actually in Discord,
# to see the raw data the sync itself sees instead of guessing from its summary output.

name: discord-inspect-thread

on:
  workflow_dispatch:
    inputs:
      thread_id:
        description: 'Discord thread (channel) id to dump messages from'
        required: true
      event_id:
        description: 'Optional scheduled-event id to highlight in the output'
        required: false

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect thread
        run: >
          npx tsx scripts/inspect-discord-thread.ts
          --thread "${{ inputs.thread_id }}"
          ${{ inputs.event_id && format('--event "{0}"', inputs.event_id) || '' }}
